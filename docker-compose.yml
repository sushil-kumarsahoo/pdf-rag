services:
  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports: 
       - "6333:6333"
    volumes:
      - qdrant_hidden_data:/qdrant/storage
    restart: unless-stopped 
    
volumes:
    qdrant_hidden_data:      
      